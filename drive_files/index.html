<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Banners</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; }
        .banner-container { display: flex; flex-direction: column; gap: 15px; }
        .banner {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white; padding: 25px; border-radius: 12px;
            text-decoration: none; font-size: 18px; font-weight: bold;
            text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .banner.study { background: linear-gradient(135deg, #ff9a44 0%, #fc6076 100%); }
    </style>
</head>
<body>
    <div class="banner-container">
        <a href="https://example.com/link1" class="banner">🎯 പ്രധാന ലിങ്ക് ഓപ്പൺ ചെയ്യുക</a>
        <a href="https://example.com/link2" class="banner study">📚 പഠന സാമഗ്രികൾക്കായുള്ള ലിങ്ക്</a>
    </div>
</body>
</html>
